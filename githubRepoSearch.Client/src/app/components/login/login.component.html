<div class="login-container">
    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
  
      <h2>Login</h2>
  
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput type="text" name="username" [(ngModel)]="username" required />
      </mat-form-field>
  
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required />
      </mat-form-field>
  
      @if(error) {
        <p class="error">{{ error }}</p>
      }
      
      <button mat-raised-button color="primary" class="full-width" type="submit">
        Login
      </button>
  
    </form>
  </div>
