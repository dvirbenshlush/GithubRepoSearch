<mat-card class="repo-card">
    <mat-card-header>
      <div mat-card-avatar class="avatar" [ngStyle]="{ backgroundImage: 'url(' + avatarUrl + ')' }"></div>
      <mat-card-title>{{ name() }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>{{ description() }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button color="primary" (click)="bookmark.emit()">Bookmark</button>
    </mat-card-actions>
  </mat-card>
